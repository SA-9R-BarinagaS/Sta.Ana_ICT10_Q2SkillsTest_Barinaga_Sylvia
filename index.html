<style>
    body {
        background:
            radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.8) 0 2px, transparent 3px),
            radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.7) 0 2px, transparent 3px),
            linear-gradient(135deg, #dff7f2, #e8f0ff, #f3e8ff);
        background-size: 80px 80px, 100px 100px, cover;
        min-height: 100vh;
        font-family: Arial, sans-serif;
    }

    .container {
        padding-top: 45px;
        padding-bottom: 45px;
    }

    /* Main chemistry card */
    .card {
        border: 2px solid #8bd5ca;
        border-radius: 20px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 12px 35px rgba(38, 93, 88, 0.18);
    }

    /* Periodic-table inspired header */
    .card-header {
        border-radius: 0 !important;
        background: linear-gradient(135deg, #075e54, #0f766e) !important;
        padding: 28px !important;
        position: relative;
        overflow: hidden;
    }

    .card-header::before {
        content: "H   He   C   N   O   F   Ne";
        position: absolute;
        top: 8px;
        left: 0;
        right: 0;
        font-size: 0.7rem;
        letter-spacing: 12px;
        color: rgba(255, 255, 255, 0.12);
        white-space: nowrap;
    }

    .card-header::after {
        content: "⚛";
        position: absolute;
        right: 25px;
        bottom: -20px;
        font-size: 110px;
        color: rgba(255, 255, 255, 0.08);
    }

    .card-header h2 {
        font-weight: 700;
        letter-spacing: 0.5px;
        position: relative;
        z-index: 1;
    }

    .card-header p {
        opacity: 0.9;
        position: relative;
        z-index: 1;
    }

    /* Instructions */
    .alert-info {
        background: #e0f7f4;
        border: 1px solid #99dcd3;
        border-left: 6px solid #0f766e;
        border-radius: 12px;
        color: #134e4a;
        padding: 16px;
    }

    .alert-info::before {
        content: "⚗ ";
        font-size: 1.1rem;
    }

    /* Input */
    .form-label {
        color: #134e4a;
        margin-bottom: 8px;
    }

    .form-control {
        border: 2px solid #a7d8d2;
        border-radius: 12px;
        background: #f8fffe;
        font-size: 1.1rem;
        transition: all 0.2s ease;
    }

    .form-control:focus {
        border-color: #0f766e;
        background: white;
        box-shadow: 0 0 0 0.2rem rgba(15, 118, 110, 0.15);
    }

    .form-control::placeholder {
        color: #94aaa7;
    }

    /* Search button */
    .btn-success {
        background: linear-gradient(135deg, #059669, #0f766e);
        border: none;
        border-radius: 12px;
        font-weight: 600;
        padding: 12px;
        transition: all 0.2s ease;
    }

    .btn-success:hover {
        transform: translateY(-2px);
        box-shadow: 0 7px 18px rgba(15, 118, 110, 0.3);
        background: linear-gradient(135deg, #047857, #115e59);
    }

    /* Divider */
    hr {
        margin: 28px 0;
        border: 0;
        border-top: 2px dashed #b8ddd8;
        opacity: 1;
    }

    /* Result heading */
    .text-primary {
        color: #0f766e !important;
        font-weight: 700;
    }

    /* Result box */
    #result {
        min-height: 150px;
        font-size: 1rem;
        background: #f5fffd;
        border: 1px solid #b8ddd8;
        border-left: 6px solid #0f766e;
        border-radius: 12px !important;
        padding: 20px !important;
        transition: all 0.3s ease;
    }

    /* Element information */
    .element-result {
        background: linear-gradient(135deg, #ecfdf5, #f0fdfa);
        border: 2px solid #99dcd3;
        border-radius: 14px;
        padding: 18px;
        position: relative;
        overflow: hidden;
    }

    /* Decorative periodic-table symbol */
    .element-result::after {
        content: "⚛";
        position: absolute;
        right: 15px;
        bottom: -18px;
        font-size: 90px;
        color: rgba(15, 118, 110, 0.07);
    }

    .result-title {
        font-size: 1.15rem;
        font-weight: 700;
        color: #115e59;
        margin-bottom: 15px;
        padding-bottom: 8px;
        border-bottom: 2px solid #a7d8d2;
    }

    .element-result p {
        margin-bottom: 8px;
        color: #374151;
        position: relative;
        z-index: 1;
    }

    .element-result p:last-child {
        margin-bottom: 0;
    }

    .element-result b {
        color: #0f766e;
    }

    /* Makes the symbol stand out like a periodic-table tile */
    .element-result p:first-of-type {
        display: inline-block;
        background: #ccfbf1;
        border: 2px solid #5eead4;
        border-radius: 10px;
        padding: 8px 14px;
        margin-bottom: 14px;
        font-size: 1.1rem;
    }

    /* Error message */
    .alert-danger {
        border: none;
        border-left: 6px solid #dc2626;
        border-radius: 12px;
        background: #fff1f2;
        color: #881337;
    }

    /* Footer */
    .card-footer {
        border-top: 1px solid #cce5e1;
        background: #f0fdfa !important;
        padding: 15px;
    }

    .footer-text {
        font-size: 0.9rem;
        color: #47716d;
    }

    /* Small periodic-table decorations */
    .card-body::before {
        content: "PERIODIC TABLE • CHEMISTRY • NON-METALS";
        display: block;
        text-align: center;
        font-size: 0.65rem;
        font-weight: bold;
        letter-spacing: 3px;
        color: #8aa9a5;
        margin-bottom: 15px;
    }

    /* Mobile */
    @media (max-width: 576px) {
        .container {
            padding-top: 25px;
        }

        .card-header {
            padding: 22px !important;
        }

        .card-header h2 {
            font-size: 1.5rem;
        }

        .card-body {
            padding: 20px !important;
        }

        .card-header::after {
            font-size: 80px;
        }
    }
</style>
